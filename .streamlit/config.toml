[global]
developmentMode = false

[server]
headless = true
fileWatcherType = "none"
maxUploadSize = 2048
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#693d30"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f1ef"
textColor = "#3b2620"
